[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "choicer-voicer-pack-creator"
version = "1.0.0"
description = "A visual desktop editor for creating and modifying Choicer Voicer dub packs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Choicer Voicer Pack Creator contributors" }]
keywords = ["choicer-voicer", "dub", "voice-acting", "video", "editor"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "PySide6==6.11.2",
  "mcp==1.29.1",
  "yt-dlp==2026.8.19",
  "yt-dlp-ejs==0.8.0",
  "deno==2.9.6",
  "onnxruntime==1.26.0",
  "numpy==2.4.6",
  "soundfile==0.13.1",
  "flatbuffers==25.12.19",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pytest-qt>=4.4,<5",
]
build = [
  "pyinstaller==6.22.2",
]
dev = [
  "choicer-voicer-pack-creator[test,build]",
  "ruff>=0.9,<1",
]

[project.scripts]
choicer-voicer-pack-creator = "choicer_voicer_pack_creator.app:main"
choicer-voicer-mcp = "choicer_voicer_pack_creator.mcp_server:main"

[project.urls]
Repository = "https://github.com/throndir2/ChoicerVoicerPackCreator"
Issues = "https://github.com/throndir2/ChoicerVoicerPackCreator/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
choicer_voicer_pack_creator = ["resources/*.json", "resources/*.txt", "resources/*.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires local FFmpeg and FFprobe executables",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
