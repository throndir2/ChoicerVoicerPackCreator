name: Create GitHub Release
run-name: Create GitHub release from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: create-github-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: release
        shell: powershell
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "GitHub releases must be created from the canonical main branch"
          }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Could not resolve the release version from pyproject.toml"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Refuse an existing version before building
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = "Continue"
            & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
            $releaseExists = $LASTEXITCODE -eq 0
            & git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" 1>$null 2>$null
            $tagExists = $LASTEXITCODE -eq 0
          }
          finally {
            $ErrorActionPreference = $previousPreference
          }
          if ($releaseExists -or $tagExists) {
            throw "Release or tag $env:RELEASE_TAG already exists; bump the project version first"
          }
          Write-Host "Version $env:RELEASE_TAG is available"
          exit 0

      - name: Build validated portable ZIP
        shell: powershell
        run: .\Build-Portable.ps1

      - name: Create checksum file
        shell: powershell
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $zip = "dist/v$env:APP_VERSION/Choicer-Voicer-Pack-Creator-$env:APP_VERSION-Windows-x64.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Release ZIP was not generated: $zip"
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $filename = [IO.Path]::GetFileName($zip)
          "$hash  $filename" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Create GitHub release and upload ZIP
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $zip = "dist/v$env:APP_VERSION/Choicer-Voicer-Pack-Creator-$env:APP_VERSION-Windows-x64.zip"
          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            $zip, "$zip.sha256",
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "Choicer Voicer Pack Creator $env:APP_VERSION",
            "--generate-notes"
          )
          if ($env:RELEASE_PRERELEASE -eq "true") {
            $arguments += "--prerelease"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE"
          }