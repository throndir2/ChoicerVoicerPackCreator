name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Install project
        run: python -m pip install -e ".[test,build]" ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=choicer_voicer_pack_creator --cov-report=term-missing
      - name: Cache pinned FFmpeg archive
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-win64-lgpl-shared-562ea50b4f2d213e
      - name: Build Windows application
        shell: powershell
        run: .\Build-Portable.ps1
      - name: Smoke-test bundled FFmpeg application
        run: python scripts/smoke_packaged.py
      - name: Export pack with bundled FFmpeg
        shell: powershell
        run: |
          $manifest = Get-Content "dist/v0.2.3/latest-portable.json" -Raw | ConvertFrom-Json
          $ffmpegDir = Join-Path $PWD (Join-Path $manifest.application_directory "bin")
          python scripts/create_validation_fixture.py build/bundled-ffmpeg-validation --ffmpeg-dir "$ffmpegDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload self-contained Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: Choicer-Voicer-Pack-Creator-0.2.3-Windows-x64
          path: dist/v0.2.3/Choicer-Voicer-Pack-Creator-0.2.3-Windows-x64.zip
          if-no-files-found: error

  runtime-validation:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and Godot prerequisites
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg unzip
      - name: Install Godot
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Install project
        run: python -m pip install -e .
      - name: Create exported fixture
        run: python scripts/create_validation_fixture.py build/runtime-validation
      - name: Run Godot and Xiph gates
        run: >-
          python scripts/validate_external.py
          "build/runtime-validation/output/Pack Creator Validation Fixture"
          --require-godot --require-xiph
